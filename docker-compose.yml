version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/workspace/backend
      - ./demo-data:/workspace/demo-data:ro
      - ./.env:/workspace/.env:ro
    ports:
      - "8000:8000"
    env_file: ./.env

  frontend:
    build: ./frontend
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: http://backend:8000
      DEMO_API_TOKEN: ${DEMO_API_TOKEN:?Set DEMO_API_TOKEN in the root .env}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
